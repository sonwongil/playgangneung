# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PLAY강릉 Nginx 설정 — Cafe24 VPS 배포용
#
# 설치 위치: /etc/nginx/sites-available/playgangneung
# 활성화:    sudo ln -s /etc/nginx/sites-available/playgangneung \
#                       /etc/nginx/sites-enabled/playgangneung
#            sudo nginx -t && sudo systemctl reload nginx
#
# location 우선순위 (위에서 아래 순):
#   1. /api/cards/          — 카드이미지 정적 서비스 (^~ 로 regex 차단)
#   2. /api/proxy/download  — 이미지 다운로드 프록시 (타임아웃 연장)
#   3. /api/                — 일반 API 요청
#   4. /content/            — SSR 콘텐츠 상세
#   5. /about               — 소개 페이지
#   6. /sitemap.xml         — 사이트맵
#   7. /                    — React 프론트엔드 정적 파일
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

upstream api_server {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name playgangneung.com www.playgangneung.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 메인 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playgangneung.com www.playgangneung.com;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/playgangneung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playgangneung.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 업로드 파일 최대 크기 (카드이미지 업로드 등)
    client_max_body_size 25M;

    # ── 1. 카드이미지 정적 서비스 (/api/cards/) ──────────────
    # ^~ 를 사용해 아래 regex 보다 먼저 매칭되도록 보장
    location ^~ /api/cards/ {
        proxy_pass       http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header       Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── 2. 이미지 다운로드 프록시 (타임아웃 연장) ────────────
    # 한국 정부 사이트 응답 지연 대비 — /api/ 블록보다 먼저 선언
    location ^~ /api/proxy/download {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── 3. 일반 API 요청 (/api/) ─────────────────────────────
    location ^~ /api/ {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 4. SSR 콘텐츠 상세 (/content/) ───────────────────────
    location ^~ /content/ {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 5. 소개 페이지 (/about) ───────────────────────────────
    location ^~ /about {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 6. 사이트맵 (/sitemap.xml) ────────────────────────────
    location = /sitemap.xml {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 7. React 프론트엔드 정적 파일 (/) ────────────────────
    root /var/www/playgangneung/artifacts/playgangneung-dashboard/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 장기 캐시 (해시 붙은 JS/CSS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 로그
    access_log /var/log/nginx/playgangneung_access.log;
    error_log  /var/log/nginx/playgangneung_error.log;
}
