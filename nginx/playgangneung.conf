# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PLAY강릉 Nginx 설정 — Cafe24 VPS 배포용
#
# 설치 위치: /etc/nginx/sites-available/playgangneung
# 활성화:    sudo ln -s /etc/nginx/sites-available/playgangneung \
#                       /etc/nginx/sites-enabled/playgangneung
#            sudo nginx -t && sudo systemctl reload nginx
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

upstream api_server {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name playgangneung.com www.playgangneung.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 메인 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playgangneung.com www.playgangneung.com;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/playgangneung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playgangneung.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 업로드 파일 최대 크기 (카드이미지 업로드 등)
    client_max_body_size 25M;

    # ── API 서버 프록시 (/api, /content, /about, /sitemap.xml) ──
    location ~ ^/(api|content|about|sitemap\.xml) {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 이미지 다운로드 프록시: 한국 정부 사이트 타임아웃 대비 연장
        location /api/proxy/download {
            proxy_pass       http://api_server;
            proxy_read_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── 생성된 카드이미지 정적 서비스 (/api/cards) ──
    # Express가 처리하지만, 자주 변경 안 되는 파일이므로 캐시 설정
    location /api/cards/ {
        proxy_pass       http://api_server;
        proxy_set_header Host $host;
        add_header       Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── React 프론트엔드 정적 파일 (/) ──
    root /var/www/playgangneung/artifacts/playgangneung-dashboard/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 장기 캐시 (해시 붙은 JS/CSS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 로그
    access_log /var/log/nginx/playgangneung_access.log;
    error_log  /var/log/nginx/playgangneung_error.log;
}
