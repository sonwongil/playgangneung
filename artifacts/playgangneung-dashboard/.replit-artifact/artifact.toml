kind = "web"
previewPath = "/"
title = "PlayGangneung Dashboard"
version = "1.0.0"
id = "artifacts/playgangneung-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22508

[services.development]
run = "pnpm --filter @workspace/playgangneung-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/playgangneung-dashboard", "run", "build" ]
publicDir = "artifacts/playgangneung-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22508"
BASE_PATH = "/"
